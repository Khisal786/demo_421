<section id="menu-section" class="menu-section">
  <div class="container">
    {% for category in site.data.menu.categories %}
      <h3 class="category-title">{{ category.name }}</h3>
      <div class="menu-grid">
        {% assign items = site.data.menu.items | where: "category", category.id %}
        {% for item in items %}
          <div class="menu-card">
            <img src="{{ site.baseurl }}{{ item.image }}" alt="{{ item.name }}" class="menu-card-img" onerror="this.src='{{ site.baseurl }}/assets/images/hero-bg.webp'">
            <div class="menu-card-content">
              <h4 class="item-title">{{ item.name }}</h4>
              <p class="item-desc">{{ item.description }}</p>
              <div class="item-footer">
                <span class="item-price">${{ item.price | round: 2 }}</span>
                <button type="button" class="btn-customize" onclick='openItemModal({{ item | jsonify }})'>
                  Customize & Order &rarr;
                </button>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
</section>
